<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2925"/>
      <stop offset="1" stop-color="#121110"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa261"/>
      <stop offset="1" stop-color="#ea6a1f"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f3ec"/>
      <stop offset="1" stop-color="#d9d2c6"/>
    </linearGradient>
    <linearGradient id="dim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d675e"/>
      <stop offset="1" stop-color="#4a463f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="tile" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824×824 body centred on a 1024 canvas -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  </g>
  <g filter="url(#tile)">
    <rect x="384" y="236" width="256" height="256" rx="58" fill="url(#dim)"/>
    <rect x="236" y="532" width="256" height="256" rx="58" fill="url(#orange)"/>
    <rect x="532" y="532" width="256" height="256" rx="58" fill="url(#light)"/>
  </g>
  <rect x="236" y="532" width="256" height="128" rx="58" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="532" y="532" width="256" height="128" rx="58" fill="#ffffff" fill-opacity="0.25"/>
</svg>
