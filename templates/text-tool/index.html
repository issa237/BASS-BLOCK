<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Markdown + Word Stats</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="bar">
      <button id="open" class="btn">Open…</button>
      <button id="save" class="btn">Save as…</button>
      <span id="file" class="muted"></span>
      <span class="spacer"></span>
      <span id="saved" class="muted">Saved</span>
    </header>
    <div class="split">
      <textarea id="editor" spellcheck="true" placeholder="Start writing markdown…"></textarea>
      <aside class="stats">
        <div class="kpis">
          <div><b id="words">0</b><span>words</span></div>
          <div><b id="chars">0</b><span>characters</span></div>
          <div><b id="read">0</b><span>min read</span></div>
        </div>
        <h2>Most frequent words</h2>
        <ol id="top"></ol>
        <p class="muted small">Common words like “the” and “and” are skipped.</p>
      </aside>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
