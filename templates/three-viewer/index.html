<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>STL Viewer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="view"></div>
    <header class="hud">
      <button id="open" class="btn">Open STL…</button>
      <label class="toggle"><input id="wire" type="checkbox" /> Wireframe</label>
      <button id="fit" class="btn">Fit view</button>
      <span id="info" class="muted">Demo shape · drop an .stl file anywhere</span>
    </header>
    <script type="module" src="main.js"></script>
  </body>
</html>
